name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  helper:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04, not ubuntu-latest: Python 3.9, the helper's floor, has no Ubuntu 26.04 build.
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - run: python -m pip install pytest
      - name: Tests for work.py, its launcher and the compaction hook
        run: python -m pytest work/scripts/tests -q
