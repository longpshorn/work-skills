name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  helper:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: test_readme_refresh checks PAST_TEMPLATES against every past store README template.
          fetch-depth: 0
      # Python 3.9, the helper's floor, from uv on every OS; the activated venv puts it first on PATH.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.9"
          activate-environment: true
      - name: Python under test
        run: python -c "import sys; print(sys.version); assert sys.version_info[:2] == (3, 9), sys.version"
      - run: uv pip install pytest
      - name: Tests for work.py, its launcher and the compaction hook
        run: python -m pytest work/scripts/tests -q
