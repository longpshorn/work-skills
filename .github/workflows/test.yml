name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  helper:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install Python 3.9
        run: uv python install 3.9
      - name: Python version
        run: uv run --no-project --python 3.9 python -c "import sys; print(sys.version); sys.exit(sys.version_info[:2] != (3, 9))"
      - name: Tests for work.py, its launcher and the compaction hook
        run: uv run --no-project --python 3.9 --with pytest python -m pytest work/scripts/tests -q
